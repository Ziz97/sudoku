<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sudoku</title>
  <meta name="description" content="Play Sudoku in your browser, or set up your own grid." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f5bea'/><text x='16' y='23' font-family='Georgia' font-size='20' font-weight='700' text-anchor='middle' fill='white'>9</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand"><span class="brand-mark" aria-hidden="true">9</span>Sudoku</h1>

      <nav class="mode-switch" role="tablist" aria-label="Mode">
        <button role="tab" id="tab-play" class="mode-btn" aria-selected="true">Play</button>
        <button role="tab" id="tab-setup" class="mode-btn" aria-selected="false">Set up grid</button>
      </nav>

      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <main class="layout">
      <section class="board-area">
        <div id="setup-banner" class="setup-banner" hidden>
          <strong>Setup mode</strong>
          <span>Type the clues of your grid. Mistakes and conflicts are not shown.</span>
        </div>

        <div class="status-bar" id="status-bar">
          <div class="stat"><span class="stat-label">Level</span><span class="stat-value" id="stat-level">—</span></div>
          <div class="stat" id="stat-mistakes-wrap"><span class="stat-label">Mistakes</span><span class="stat-value" id="stat-mistakes">0</span></div>
          <div class="stat"><span class="stat-label">Time</span><span class="stat-value mono" id="stat-time">00:00</span></div>
          <button id="pause-btn" class="icon-btn small" aria-label="Pause" title="Pause (P)">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
          </button>
        </div>

        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Sudoku grid"></div>
          <div id="pause-overlay" class="pause-overlay" hidden>
            <button id="resume-btn" class="btn primary">Resume</button>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div id="play-controls" class="panel-block">
          <label class="field">
            <span>Difficulty</span>
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
              <option value="expert">Expert</option>
            </select>
          </label>
          <button id="new-game-btn" class="btn primary">New game</button>
        </div>

        <div id="setup-controls" class="panel-block" hidden>
          <button id="setup-start-btn" class="btn primary">Start playing this grid</button>
          <div class="btn-row">
            <button id="setup-clear-btn" class="btn">Clear grid</button>
            <button id="setup-cancel-btn" class="btn">Cancel</button>
          </div>
          <p class="hint-text" id="setup-count">0 clues entered</p>
        </div>

        <div class="tools">
          <button class="tool" id="undo-btn" title="Undo (Ctrl+Z)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62A7.94 7.94 0 0 1 12.5 10.5c3.54 0 6.55 2.31 7.6 5.5l2.37-.78A10.5 10.5 0 0 0 12.5 8z"/></svg>
            <span>Undo</span>
          </button>
          <button class="tool" id="erase-btn" title="Erase (Backspace)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.24 3.56 21.19 8.5a1.5 1.5 0 0 1 0 2.12L12 19.8h8V22H8.5l-4.24-4.24a1.5 1.5 0 0 1 0-2.12L14.12 3.56a1.5 1.5 0 0 1 2.12 0zM6.38 16.7l2.95 2.95.18.15h.03l3.18-3.18-4.95-4.95-1.39 1.4a1.5 1.5 0 0 0 0 2.12z"/></svg>
            <span>Erase</span>
          </button>
          <button class="tool" id="notes-btn" title="Notes (N)" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            <span>Notes <em id="notes-state">off</em></span>
          </button>
          <button class="tool" id="hint-btn" title="Hint (H)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 21h6v-1H9v1zm3-19a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2z"/></svg>
            <span>Hint</span>
          </button>
        </div>

        <div id="numpad" class="numpad" aria-label="Number pad"></div>

        <label class="switch" id="mistakes-switch">
          <input type="checkbox" id="show-mistakes" checked />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span>Show mistakes while playing</span>
        </label>

        <details class="help">
          <summary>Keyboard shortcuts</summary>
          <ul>
            <li><kbd>1</kbd>–<kbd>9</kbd> place a number</li>
            <li><kbd>Shift</kbd> + number: toggle a note</li>
            <li><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> move</li>
            <li><kbd>Backspace</kbd> erase · <kbd>N</kbd> notes · <kbd>H</kbd> hint</li>
            <li><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Z</kbd> undo · <kbd>P</kbd> pause</li>
          </ul>
        </details>
      </aside>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-emoji" id="modal-icon" aria-hidden="true"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div class="modal-actions" id="modal-actions"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/sudoku.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
